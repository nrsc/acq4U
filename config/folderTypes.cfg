Day:
    name: "%Y.%m.%d"
    experimentalUnit: True   ## A day is an experimental 'unit'. This means that a single log file will be kept for each day.
    info:
        description: "text", 6
        species: "list", ["CBA Mouse", "DBA Mouse", "Rat"]
        age: "string"
        sex: "list", ['M', 'F']
        weight: "string"
        temperature: "list", ['34C', '25C', '37C']
        solution: "list", ["Standard ACSF", "Physiological ACSF"]
        internal: "list", ["Standard K-Gluc", "Cesium"]
Donor:
    name: "Donor"
    date: "%Y.%m.%d"
    experimentalUnit: True   ## A Donor is an experimental 'unit'. This means that a single log file will be kept for each Donor    .
    info:
        description: "text", 6
        species: "list", ["Mouse", "Human", "Macaque"]
        age: "string"
        sex: "list", ['M', 'F']
        region: "string"
        weight: "string"
        Slices: "string"
        User: "string"
        Donor_date: "string"
        DIV: "string"
        DPI: "string"
Slice:
    name: "slice"
    experimentalUnit: True   ## A Slice is an experimental 'unit'. This means that a single log file will be kept for each slice    .
    info:
        User: "list", ["ScottS", "ScottO", "Brian", "Cristina", "Nikolai", "Jeffrey", "Krista", "Meanhwan"]
        location: "string"
        Cortical_area: "string"
        Brain_region: "string"
        #viral labeling: "list", ["None", "AiP11633", "AiP15373", "AiP12320", "CN1390", "AiP12320"]
        viral labeling: "string",# ["None", "AiP11633", "AiP15373", "AiP12320", "CN1390", "AiP12320"]
        slice_type: "list", ["acute", "culture"]
        DIV: "string"
        solution: "list", ["offP-rACSF", "ACSF3"]
        blockers: "list", ["None", "Ptx/Ka", "DNQX[20uM], APV[25uM], Gabazine[5uM]"]
        internal: "string"
        temperature: "list", ['34C', '25C', '37C']
        notes: "text", 4
Cell:
    name: "cell"
    info:
        ID: "string"
        location: "string"
        type: "list", ['unknown', 'pyramidal', 'inhibitory', 'bushy', 'stellate', 'fast spiking', 'globular bushy', 'chandelier', 'spherical bushy', 'D-stellate', 'T-stellate',  'tuberculoventral', 'cartwheel', 'octopus', 'double-boquet']
        Reporter_positive: "list", ["Y", "N", "unknown"]
        Operator_call: "string"
        Layer_estimate: "list", ["L1", "L2", "L2/3", "L3", "L4", "L4/5", "L5", "L5/6", "L6"]
        Vm-break: "string"
        Rm: "string"
        depth from pia: "string"
        notes: "text", 20
        ivscc protocol: "list", ["Success", "partial-success", "fail", "not-attempted"]
        FI-sweeps: "string"
        VI-sweeps: "string"
        chirp-sweeps: "string"
        puff_drug: "list", ["5HT[100uM]", "5HT[200uM]", "5CT[50nM]", "5CT[200nM]", "Carb[50uM]", "acsf"]
        bath_drug: "list", ["Ket", "WAY635", "Ket;WAY635"]
        wash_drug: "list", ["Ket", "WAY635", "Ket;WAY635", "ZD7288[10uM]", "4-AP[50uM]"]
        wash_sweep: "string"
        JEM_code (sample_id): "string"
        Nucleus Pull notes: "text", 10
        Experiment Quailty: "list", ["High Quality", "Good", "Partial-Success", "Poor", "OMIT"]
Mosaic:
    name: "mosaic"
    info:
        location: "string"
        notes: "text", 4
Site:
    name: "site"
    info:
        location: "string"
        notes: "text", 4
Pair:
    name: "pair"
    info:
        device 1: "list", ["Clamp1", "Clamp2"]
        location 1: "string"
        type 1: "list", ['unknown', 'previous', 'bushy', 'stellate', 'pyramidal', 'fast spiking', 'globular bushy', 'spherical bushy', 'D-stellate', 'T-stellate',  'tuberculoventral', 'cartwheel', 'octopus']
        device 2: "list", ["Clamp2", "Clamp1"]
        location 2: "string"
        type 2: "list", ['unknown', 'previous', 'bushy', 'stellate', 'pyramidal', 'fast spiking', 'globular bushy', 'spherical bushy', 'D-stellate', 'T-stellate',  'tuberculoventral', 'cartwheel', 'octopus']
        notes: "text", 10        
