
# RecordingChamber is used to mark the position and boundaries of a recording chamber under the microscope.
# In some setups, these are used to inform automated patch planning.
RecordingChamber:
    driver: 'RecordingChamber'
    radius: 5*mm
    transform:
        # Place the center of the recording chamber (top surface of the glass) at 0,0,0 in the global coordinate system
        pos: 0, 0, 0


# Scientifica SliceScope stage
#
StageFocus:
    driver: 'Scientifica'
    name: 'StageFocus' # specify the device either by COM port or by the name assigned to it via LinLab
    #port: 'com104'
    scale: 1e-6, -1e-6, 1e-7  # convert um to m, reverse Z axis to make +Z point upward
    # params:
    #     # All parameters are optional. Some values (especially `currents` and `axisScale`
    #     # depend on the type of device. For descriptions, see drivers/Scientifica/scientifica.py
    #     # or the Scientifica API documentation. 
    #     #currents: 200, 125  # be careful to follow manufacturer specs!
    #     axisScale: 5.12, -5.12, -6.4  # +x points right, +y points away, +z points up
    #     joyDirectionX: True
    #     joyDirectionY: True
    #     joyDirectionZ: False
    #     minSpeed: 1000
    #     maxSpeed: 30000
    #     accel: 500
    #     joySlowScale: 4
    #     joyFastScale: 80
    #     joyAccel: 500

# A microscope device, providing a way to inform ACQ4 about the set of 
# objective lenses available and which objective is currently in use. 
Microscope:
    driver: 'Microscope'
    parentDevice: 'StageFocus'
    objectives:
        0:  # first slot always has a 5X objective
            4x:
                name: '4x/0.13 UPlanFL N'
                scale: 1.0 / 4.0
                offset: -12*um, 40*um, -2.2*mm
        1:  # second slot may have a 40x or 63x objective
            40x:
                name: '40x/0.80 LUMPlanFL N'
                scale: 1.0 / 40.0
                offset: 30*um, -120*um


Camera:
    driver: 'MicroManagerCamera'
    mmAdapterName: 'ThorlabsUSBCamera'
    mmDeviceName: 'ThorCam'   # "ThorCam: Thorlabs DCx USB Camera"
    parentDevice: 'Microscope'
    transform:
        pos: (0, 0)
        scale: (5.3 * um/px, -5.3 * um/px)
        angle: 0

    params:                             ## default parameters to apply to camera at startup
        PixelClockMHz: 86.0
        PixelType: "16bit"
    #     #TEMP_SETPOINT:  -2000
        exposure: 20e-3
    #     binning: 4,4    


